<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Multi Câmeras e TV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }
        h1 {
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 15px;
            padding: 20px;
        }
        .card {
            background: #1c1c1c;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0,0,0,.5);
        }
        .header {
            background: #202020;
            padding: 12px;
            text-align: center;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .status {
            width: 10px;
            height: 10px;
            background: #00ff55;
            border-radius: 50%;
        }
        video, iframe {
            width: 100%;
            height: 240px;
            border: 0;
            background: #000;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            background: #0b84ff;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }
        button:hover {
            background: #0066cc;
        }
    </style>
</head>
<body>
   <div class="grid">

           <!-- Câmeras -->
        <div class="card">
            <div class="header"><span class="status"></span>Ponte da Amizade - Sentido Brasil</div>
            <iframe allowfullscreen src="https://playerv.logicahost.com.br/video-ip-camera/portovelhomamore//false/false/V2tjeGMyRXhjRmhQU0dSUFVYcFdlbGxxU210alJtdDVVbTA1YVUwd05IZFVSekZQWkcxS1ZFNVhiR3BhZWpBNStS/16:9/V1ZWb1UwMUhUa2xVVkZwTlpWUm5PUT09K1I=/fozpontedaamizadesentidobrasil.stream/?autoplay=1&mute=1"></iframe>
        </div>

        <div class="card">
            <div class="header"><span class="status"></span>Ponte da Amizade - Sentido Paraguai</div>
            <iframe allowfullscreen src="https://playerv.logicahost.com.br/video-ip-camera/portovelhomamore//false/false/V2tjeGMyRXhjRmhQU0dSUFVYcFdlbGxxU210alJtdDVVbTA1YVUwd05IZFVSekZQWkcxS1ZFNVhiR3BhZWpBNStS/16:9/V1ZWb1UwMUhUa2xVVkZwTlpWUm5PUT09K1I=/fozpontedaamizadesentidoparaguai.stream/?autoplay=1&mute=1"></iframe>
        </div>

        <div class="card">
            <div class="header"><span class="status"></span>BR-277 Aduana Ponte da Amizade</div>
            <iframe allowfullscreen src="https://playerv.logicahost.com.br/video-ip-camera/portovelhomamore//false/false/dmlkZW8wNC5sb2dpY2Fob3N0LmNvbS5icisx/16:9/YUhSMGNITTZMeTgK1o=/fozaduanapontedaamizade.stream/?autoplay=1&mute=1"></iframe>
        </div>

        <div class="card">
            <div class="header"><span class="status"></span>BR-277 Sentido Ponte da Amizade</div>
            <iframe allowfullscreen src="https://playerv.logicahost.com.br/video-ip-camera/portaldacidade//false/false/V2tjeGMyRXhjRmhQU0dST1lWUldlbGxxU210alJtdDVVbTA1YVUwd05IZFVSekZQWkcxS1ZFNVhiR3BhZWpBNStS/16:9/aHR0cHM6Ly8rMQ==/fozsentidopontedaamizade01.stream/?autoplay=1&mute=1"></iframe>
        </div>

      
    <script>
               canais.forEach(c => {
            const video = document.getElementById(c.id);
            if (!video) return;

            if (Hls.isSupported()) {
                const hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true
                });
                hls.loadSource(c.url);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
                hls.on(Hls.Events.ERROR, (event, data) => {
                    console.error(`Erro no canal ${c.id}:`, data);
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = c.url;
                video.play();
            }
        });

        function fullscreen(id) {
            const element = document.getElementById(id);
            if (!element) return;

            if (element.requestFullscreen) {
                element.requestFullscreen();
            } else if (element.webkitRequestFullscreen) {
                element.webkitRequestFullscreen();
            } else if (element.msRequestFullscreen) {
                element.msRequestFullscreen();
            }
        }
    </script>
</body>
</html>
