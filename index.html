<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel Multi Câmeras e TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

body{
    margin:0;
    background:#111;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    /* Impede a seleção acidental de textos na tela */
    user-select: none;
    -webkit-user-select: none;
}

h1{
    text-align:center;
    padding:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(360px,1fr));
    gap:15px;
    padding:20px;
}

.card{
    background:#1c1c1c;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 0 15px rgba(0,0,0,.5);
}

.header{
    background:#202020;
    padding:12px;
    text-align:center;
    font-size:18px;
}

.status{
    display:inline-block;
    width:10px;
    height:10px;
    background:#00ff55;
    border-radius:50%;
    margin-right:8px;
}

iframe,
video{
    width:100%;
    height:240px;
    border:0;
    background:#000;
}

button{
    width:100%;
    padding:10px;
    border:none;
    background:#0b84ff;
    color:white;
    cursor:pointer;
    font-size:15px;
}

button:hover{
    background:#0066cc;
}

</style>

</head>

<!-- Adicionado oncontextmenu="return false;" no body para bloquear o botão direito -->
<body oncontextmenu="return false;">

<script>

// BLOQUEIO DE ATALHOS DE TECLADO (F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U)
document.addEventListener('keydown', function(e) {
    if (
        e.key === 'F12' || 
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) ||
        (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.key === 'S' || e.key === 's'))
    ) {
        e.preventDefault();
        e.stopPropagation();
        return false;
    }
});

const canais=[
{
id:"tv1",
url:"https://streaming.procergs.com.br:8443/tve/smil:tve-s.smil/playlist.m3u8"
},
{
id:"tv2",
url:"https://video04.logicahost.com.br/tvpampa/tvpampa/playlist.m3u8"
},
{
id:"tv3",
url:"https://cdn.live.br1.jmvstream.com/webtv/AVJ-15086/playlist/playlist.m3u8"
}
];

canais.forEach(c=>{
let video=document.getElementById(c.id);

if(Hls.isSupported()){
let hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
hls.on(
Hls.Events.MANIFEST_PARSED,
()=>{
video.play();
}
);
}
else if(video.canPlayType('application/vnd.apple.mpegurl')){
video.src=c.url;
video.play();
}
});

function fullscreen(id){
let video=document.getElementById(id);
if(video.requestFullscreen){
video.requestFullscreen();
}
}

</script>

</html>
